<!DOCTYPE html>
<html lang="sk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>kytka9notes</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/img/favicon/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/img/favicon/apple-touch-icon.png" />
  <!-- link css -->
  <link rel="stylesheet" href="./assets/css/main/style.css">
  <link rel="stylesheet" href="./assets/css/main/notes.css">
  <link rel="stylesheet" href="./assets/css/header/external-links.css">
  <link rel="stylesheet" href="./assets/css/header/header.css">
  <link rel="stylesheet" href="./assets/css/header/extended-notes.css">
  <link rel="stylesheet" href="./assets/css/header/notes-categories.css">
</head>

<body>

  <!-- External links -->
  <div class="external-links">
    <button class="external-link"><a href="https://overapi.com/" target="_blank"
        rel="noopener noreferrer">OverAPI</a></button>
    <button class="external-link"><a href="https://developer.mozilla.org/en-US/" target="_blank"
        rel="noopener noreferrer">mdn_</a></button>
    <button class="external-link"><a href="https://livecodes.io" target="_blank"
        rel="noopener noreferrer">livecodes.io</a></button>
    <button class="external-link"><a href="https://fontawesome.com/search?q=html" target="_blank"
        rel="noopener noreferrer">fontAwesome</a></button>
    <button class="external-link"><a href="https://www.asciitable.com" target="_blank"
        rel="noopener noreferrer">ascii</a></button>
  </div>


  <!-- Hlavička -->
  <header class="main-header">
    <h2>kytka9notes</h2>
    <div class="search-hint">
      <i class="fa-solid fa-magnifying-glass" style="color: rgb(206, 206, 206);"></i>&nbsp;<kbd>TAB</kbd>
    </div>
    <a href="https://github.com/kytka9/kytka9notes" target="_blank" class="github-link">
      <i class="fa-brands fa-github"></i>
    </a>
    <div class="header-time">
      <span id="live-clock">00:00:00</span>
    </div>
    <div>command</div>
    <div class="var">var</div>
    <div class="comment">comment</div>
  </header>

  <!-- Rozšírené poznámky - Extended notes -->
  <div class="extended-notes">
    <button class="extended-note"><a href="./assets/pages/extended-notes/repo-create.html">Vytvorenie gh
        repa</a></button>
    <button class="extended-note"><a href="./assets/pages/extended-notes/repo-connection.html">Prepojenie
        repa</a></button>
  </div>


  <!-- Menu - filtre -->
  <div class="filter-container">
    <button class="filter-btn active" data-cat="all">Všetko</button>
    <button class="filter-btn" data-cat="brew">🍺 Brew</button>
    <button class="filter-btn" data-cat="git"><i class="fa-brands fa-git-alt"></i> Git</button>
    <button class="filter-btn" data-cat="terminal"><i class="fa-regular fa-folder-open"></i> Core Commands</button>
    <button class="filter-btn" data-cat="finder"><i class="fa-brands fa-apple"></i> Finder shortcuts</button>
    <button class="filter-btn" data-cat="markdown"><i class="fa-brands fa-markdown"></i> Markdown</button>
    <button class="filter-btn" data-cat="safari"><i class="fa-brands fa-safari"></i> Safari</button>
    <button class="filter-btn" data-cat="html"><i class="fa-brands fa-html5"></i> HTML</button>
    <button class="filter-btn" data-cat="vsc"><i class="fa-solid fa-laptop-code"></i> VS Code</button>
  </div>



  <!-- Poznámky -->
  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Hľadaj príkaz, funkciu, tag, hocičo...">
  </div>

  <section id="terminal-output"></section>



  <!-- Pätička -->
  <br>
  <span id="note-count" class="badge">0 príkazov</span>
  <div>
    <i class="fa-regular fa-clock"></i>
    Posledná úprava: <span id="posledna-uprava"></span>
  </div>
  <h5>kytka9@proton.me</h5>

  <!-- IMPORT POZNÁMOK -->
  <script src="./assets/data/coreCommands.js"></script>
  <script src="./assets/data/brew.js"></script>
  <script src="./assets/data/finder.js"></script>
  <script src="./assets/data/markdown.js"></script>
  <script src="./assets/data/safari.js"></script>
  <script src="./assets/data/html.js"></script>
  <script src="./assets/data/git.js"></script>
  <script src="./assets/data/vsc.js"></script>


  <!-- Hlavný script -->
  <script src="./assets/script/script.js"></script>

</body>

</html>
